<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume Viewer</title>
  <style>
    html,body{min-height:100%;overflow-y:auto}
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#f6f7fb;margin:0;padding:16px}
    .viewer{max-width:900px;margin:0 auto;background:white;border-radius:8px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
    .controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    button{padding:8px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}
    #pdfViewer{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0;min-height:700px}
    .pdf-page{display:block;max-width:100%;height:auto;box-shadow:0 2px 8px rgba(0,0,0,.16);background:#fff}
    #status{color:#666;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="viewer">
    <div class="controls">
      <button id="zoomOut" type="button">-</button>
      <div id="zoomLabel">70%</div>
      <button id="zoomIn" type="button">+</button>
      <a id="downloadBtn" href="Adad%20Al%20Shabab%E2%80%99s%20Resume.pdf" download style="margin-left:12px">Download PDF</a>
    </div>
    <div id="status">Loading resume...</div>
    <div id="pdfViewer" aria-label="Resume pages"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
